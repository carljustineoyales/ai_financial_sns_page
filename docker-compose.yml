include:
  - observability/docker-compose.yml

services:
  worker:
    build: ./worker
    env_file: .env
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
    volumes:
      - ./worker/data:/app/data
      - ./worker/output:/app/output
      - ./worker/logs:/app/logs
      - ./worker/assets:/app/assets
